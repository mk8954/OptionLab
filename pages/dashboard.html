<div class="dashboard">

    <header class="top-bar">
        <div>
            <h1>OptionLab</h1>

        </div>

        <button class="icon-btn">
            <span class="material-symbols-outlined">
                notifications
            </span>
        </button>
    </header>

    <section class="capital-card">

        <p>Virtual Capital</p>

        <h2>₹10,00,000</h2>

        <div class="stats">

            <div>
                <small>Today's P&L</small>

            </div>

            <div>

            </div>

        </div>

        <div class="quick-card">

            <span class="material-symbols-outlined">

        </div>

        <div class="quick-card">

            <span class="material-symbols-outlined">

            </span>

            <p>Analytics</p>

        </div>

        <div class="quick-card">

            <span class="material-symbols-outlined">
                history
            </span>

            <p>History</p>

        </div>
