<!-- pages/trade.html -->
<div class="trade-screen">
    <!-- =========================
         TICKER CAROUSEL
    ========================== -->
    <div id="tickerContainer" class="ticker-container">
        <!-- JS -->
    </div>


    <!-- =========================
         EXPIRY CHIPS
    ========================== -->
    <section class="expiry-bar" id="expiryBar">
        <!-- JS -->
    </section>


    <!-- =========================
         OPTION CHAIN
    ========================== -->
    <section class="chain-card">
        <div class="chain-header">
            <div class="call-title">CALL</div>
            <div class="strike-title">STRIKE</div>
            <div class="put-title">PUT</div>
        </div>
        <div id="optionChain">
            <!-- JS -->
        </div>
    </section>


    <!-- =========================
         BACKGROUND OVERLAY
    ========================== -->
    <div id="sheetOverlay" class="sheet-overlay" onclick="closeTrade()"></div>


    <!-- =========================
         TRADE SHEET (BOTTOM SHEET)
    ========================== -->
    <section class="trade-sheet" id="tradeSheet">
        <button class="close-btn" onclick="closeTrade()">×</button>


        <!-- Trade Title Header -->
        <div class="sheet-header">
            <h2 id="sheetTitle"></h2>
            <div id="sheetSubtitle"></div>
        </div>


        <!-- Premium (Editable) -->
        <div class="premium-card">
            <div class="label">PREMIUM</div>
            <div class="premium-input-group">
                <span>₹</span>
                <input type="number" id="premiumInput" value="0.00" oninput="updateTrade()">
            </div>
        </div>


        <!-- Lots -->
        <div class="lot-card">
            <button id="minusLot" onclick="changeLots(-1)">−</button>
            <div style="text-align: center;">
                <div class="lot-count"><span id="lotCount">1</span> Lot</div>
                <div class="lot-qty">Qty <span id="qtyValue">0</span> (<span id="lotSizeValue">0</span>/lot)</div>
            </div>
            <button id="plusLot" onclick="changeLots(1)">+</button>
        </div>


        <!-- Stoploss & Target -->
        <div class="sl-target">
            <div class="sl-box">
                <div class="small-title">STOP LOSS %</div>
                <div class="stepper">
                    <button onclick="changeSL(-5)">−</button>
                    <!-- Default SL is now 5 -->
                    <input id="slPercent" type="number" value="5" onchange="updateTrade()">
                    <button onclick="changeSL(5)">+</button>
                </div>
                <div id="slPremium" class="price-output">₹0.00</div>
            </div>
            <div class="tg-box">
                <div class="small-title">TARGET %</div>
                <div class="stepper">
                    <button onclick="changeTG(-5)">−</button>
                    <input id="tgPercent" type="number" value="10" onchange="updateTrade()">
                    <button onclick="changeTG(5)">+</button>
                </div>
                <div id="tgPremium" class="price-output">₹0.00</div>
            </div>
        </div>


        <!-- Risk -->
        <div id="riskCard">
            <div class="risk-values">
                <div><small>Risk</small><strong id="riskAmount">₹0</strong></div>
                <div><small>RR</small><strong id="rrRatio">1:0</strong></div>
                <div><small>Reward</small><strong id="rewardAmount">₹0</strong></div>
            </div>
            <div class="risk-bar">
                <div id="riskFill"></div>
                <div id="rewardFill"></div>
            </div>
        </div>


        <!-- Charges -->
        <div class="expand-card" id="chargesCard">
            <div class="expand-header" onclick="toggleCharges()">
                <span>Charges</span>
                <div>
                    <span id="totalCharges">₹0</span>
                    <span id="chargeArrow" style="margin-left: 8px; font-size: 12px; color: var(--muted);">▼</span>
                </div>
            </div>
            <div class="expand-body" id="chargesBody">
                <div><span>Brokerage</span><span id="brokerage">₹0</span></div>
                <div><span>Exchange</span><span id="exchange">₹0</span></div>
                <div><span>SEBI</span><span id="sebi">₹0</span></div>
                <div><span>STT</span><span id="stt">₹0</span></div>
                <div><span>Stamp</span><span id="stamp">₹0</span></div>
                <div><span>GST</span><span id="gst">₹0</span></div>
            </div>
        </div>


        <!-- Capital -->
        <div class="capital-card">
            <div>
                <span>Capital Used</span>
                <strong id="capitalUsed">₹0</strong>
            </div>
            <div>
                <span>Available Balance</span>
                <strong id="availablePortfolio">₹10,00,000</strong>
            </div>
            <div>
                <span>Break Even</span>
                <strong id="breakEven">₹0</strong>
            </div>
        </div>


        <!-- Entry Reason -->
        <div class="reason-section">
            <div class="reason-title">Reason for Entry</div>
            <div class="reason-chips" id="reasonChips">
                <div class="reason-chip active" onclick="selectReason(this)">Breakout</div>
                <div class="reason-chip" onclick="selectReason(this)">Support</div>
                <div class="reason-chip" onclick="selectReason(this)">Resistance</div>
                <div class="reason-chip" onclick="selectReason(this)">Scalping</div>
            </div>
            <div style="padding: 0 12px 12px;">
                <input type="text" id="customReason" class="custom-reason-input" placeholder="Or type custom reason..." oninput="clearChips()">
            </div>
        </div>


        <!-- Buttons -->
        <div class="trade-buttons">
            <button class="cancel-btn" onclick="closeTrade()">Cancel</button>
            <button class="buy-btn" id="buyTradeBtn" onclick="buyTrade()">Buy Trade</button>
        </div>
    </section>
</div>
