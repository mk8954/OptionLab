<div class="trade-screen">


    <!-- =========================
         INDEX TABS
    ========================== -->


    <div class="index-tabs">


        <button class="index-btn active">NIFTY</button>


        <button class="index-btn">BANKNIFTY</button>


        <button class="index-btn">FINNIFTY</button>


        <button class="index-btn">MIDCPNIFTY</button>


        <button class="index-btn">SENSEX</button>


    </div>


    <!-- =========================
         MARKET CARD
    ========================== -->


    <div class="market-card">


        <div class="market-left">


            <div class="market-title" id="indexName">
                NIFTY 50
            </div>


            <div class="market-price" id="spotPrice">
                24,350
            </div>


            <div class="market-change negative" id="dayChange">
                ▼ -82 (-0.34%)
            </div>


        </div>


        <div class="market-right">


            <div class="info-card">


                <div class="info-label">
                    ATM
                </div>


                <div class="info-value" id="atmStrike">
                    24,350
                </div>


            </div>


            <div class="info-card">


                <div class="info-label">
                    LOT SIZE
                </div>


                <div class="info-value" id="lotSize">
                    75
                </div>


            </div>


        </div>


    </div>

    <div class="spot-divider">
    <span>NIFTY 24350</span>
    </div>
    <!-- Option Chain will come here -->
    <div class="option-chain">


    <div class="chain-header">
        <div class="call-head">CALL</div>
        <div class="strike-head">STRIKE</div>
        <div class="put-head">PUT</div>
    </div>


    <div id="optionRows"></div>


</div>

</div>
